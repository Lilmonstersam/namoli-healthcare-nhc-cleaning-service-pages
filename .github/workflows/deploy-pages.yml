name: Deploy mockup to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate static site
        run: npm test

      - name: Build Pages artifact
        shell: bash
        run: |
          mkdir -p _site
          cp index.html frequency-section.css robots.txt _site/
          cp -R "Medical Centre & Clinic Cleaning Specialists _ Namoli Healthcare_files" _site/
          touch _site/.nojekyll
          find _site -name '.DS_Store' -delete
          find _site -type f \( -name 'gtm.js' -o -name 'mcfx.js' \) -delete

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
